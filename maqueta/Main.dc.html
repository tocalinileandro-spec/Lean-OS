<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lean OS: Áreas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,'Segoe UI',system-ui,sans-serif;background:#f7faff;color:#0b1b3a}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
</style>
</helmet>
<div style="width:100%;min-height:900px;background:#f7faff;font-family:Inter,'Segoe UI',system-ui,sans-serif;color:#0b1b3a">
  <header style="position:sticky;top:0;background:rgba(255,255,255,.88);border-bottom:1px solid #e1e8f5;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:14px 40px">
    <div style="display:flex;align-items:center;gap:10px">
      <span style="width:14px;height:14px;border-radius:50%;background:#2563eb;box-shadow:0 0 0 5px #eaf1ff"></span>
      <span style="font-weight:800;font-size:19px;letter-spacing:-.02em">Lean OS</span>
    </div>
    <nav style="display:flex;gap:4px;flex-wrap:wrap">
      <a href="Main.dc.html" style="padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;background:#eaf1ff;color:#1d4ed8">Áreas</a>
      <a href="Repaso.dc.html" style="padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;color:#52617f;display:flex;gap:8px;align-items:center">Repaso <span style="background:#2563eb;color:#fff;border-radius:999px;font-size:12px;padding:1px 8px">14</span></a>
      <a href="Main.dc.html" style="padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;color:#52617f">Hoy</a>
      <a href="Main.dc.html" style="padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;color:#52617f">Tareas</a>
      <a href="Main.dc.html" style="padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;color:#52617f">Apuntes</a>
    </nav>
    <div style="display:flex;align-items:center;gap:8px;font-size:13px;color:#52617f;font-weight:500">
      <span style="width:8px;height:8px;border-radius:50%;background:#16a34a"></span>Sincronizado
    </div>
  </header>

  <main style="max-width:1120px;margin:0 auto;padding:44px 40px 64px;display:flex;flex-direction:column;gap:32px">
    <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px">
      <div>
        <p style="margin:0 0 6px;font-size:14px;font-weight:600;color:#2563eb">Domingo 22 de noviembre</p>
        <h1 style="margin:0;font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1">Tus áreas</h1>
        <p style="margin:10px 0 0;font-size:16px;color:#52617f">71 tarjetas en 3 áreas. Elegí una para estudiarla o repasá todo lo de hoy.</p>
      </div>
      <a href="Repaso.dc.html" style="display:flex;align-items:center;gap:10px;background:#2563eb;color:#fff;padding:15px 26px;border-radius:999px;font-weight:700;font-size:16px;box-shadow:0 8px 24px rgba(37,99,235,.28)">
        Repasar hoy · 14
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px">
      <sc-for list="{{areas}}" as="a" hint-placeholder-count="3">
        <a href="Area.dc.html" style="background:#fff;border:1px solid #e1e8f5;border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:20px;box-shadow:0 1px 2px rgba(11,27,58,.04),0 8px 24px rgba(37,99,235,.06)">
          <div style="display:flex;justify-content:space-between;align-items:flex-start">
            <div style="width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;background:{{a.tint}};color:{{a.ink}}">{{a.inicial}}</div>
            <span style="font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:{{a.badgeBg}};color:{{a.badgeInk}}">{{a.hoy}}</span>
          </div>
          <div>
            <h2 style="margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em">{{a.nombre}}</h2>
            <p style="margin:6px 0 0;font-size:14px;color:#52617f">{{a.detalle}}</p>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            <sc-for list="{{a.subs}}" as="s" hint-placeholder-count="2">
              <span style="font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:#f2f6fd;color:#334568;border:1px solid #e1e8f5">{{s}}</span>
            </sc-for>
          </div>
          <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">
            <div style="display:flex;justify-content:space-between;font-size:13px;color:#52617f;font-weight:500"><span>Dominadas</span><span style="color:#0b1b3a;font-weight:700">{{a.dominio}}%</span></div>
            <div style="height:8px;border-radius:999px;background:#eaf1ff;overflow:hidden"><div style="height:8px;border-radius:999px;background:{{a.barra}};width:{{a.ancho}}"></div></div>
          </div>
        </a>
      </sc-for>
    </div>

    <form style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:#fff;border:1.5px dashed #c5d3ee;border-radius:20px;padding:20px 24px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <label for="nueva-area" style="font-weight:600;font-size:15px">Nueva área</label>
      <input id="nueva-area" type="text" placeholder="Ej: Finanzas, Idiomas…" style="flex:1;min-width:200px;height:46px;box-sizing:border-box;border:1px solid #e1e8f5;border-radius:999px;padding:0 20px;font-family:inherit;font-size:15px;background:#f7faff;color:#0b1b3a">
      <button type="button" style="height:46px;padding:0 24px;border-radius:999px;border:0;background:#0b1b3a;color:#fff;font-weight:600;font-size:15px">Crear área</button>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      areas: [
        { nombre: 'Programación', inicial: 'P', detalle: '43 tarjetas · 2 subáreas', subs: ['CS50', 'IA aplicada'], hoy: '9 para hoy', dominio: 38, ancho: '38%', tint: '#eaf1ff', ink: '#1d4ed8', badgeBg: '#2563eb', badgeInk: '#ffffff', barra: '#2563eb' },
        { nombre: 'Negocios', inicial: 'N', detalle: '26 tarjetas · 1 subárea', subs: ['Las 32 leyes'], hoy: '5 para hoy', dominio: 21, ancho: '21%', tint: '#e8f7ee', ink: '#166534', badgeBg: '#2563eb', badgeInk: '#ffffff', barra: '#16a34a' },
        { nombre: 'Lógica', inicial: 'L', detalle: '2 tarjetas · 1 subárea', subs: ['Brilliant'], hoy: 'Al día', dominio: 50, ancho: '50%', tint: '#fff3e0', ink: '#92400e', badgeBg: '#e8f7ee', badgeInk: '#166534', barra: '#d97706' }
      ]
    };
  }
}
</script>
</body>
</html>
