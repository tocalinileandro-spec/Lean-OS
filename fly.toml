# fly.toml app configuration file generated for lean-os on 2026-11-23T17:37:32Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'lean-os'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'rolling'

[env]
  DATA_DIR = '/data'
  NODE_ENV = 'production'
  PORT = '8080'

[[mounts]]
  source = 'lean_os_data'
  destination = '/data'
  initial_size = '1gb'
  snapshot_retention = 60

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'
    protocol = 'http'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
