# Lean OS en Fly.io. Sin secretos: APP_PASSWORD_HASH y SESSION_SECRET se cargan con `fly secrets set` (ver SECRETOS.md).
# El nombre "lean-os" puede estar tomado: si es así, cambialo acá, en SECRETOS.md y en FLY_APP de .github/workflows/ci.yml.
app = "lean-os"
primary_region = "eze" # Buenos Aires

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATA_DIR = "/data"

# Una sola máquina: SQLite vive en un volumen que no se comparte entre máquinas.
# Siempre encendida (no se apaga sola) para que el respaldo nocturno de las 03:00 corra.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    protocol = "http"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

# El volumen con los datos: un despliegue nunca lo reemplaza. Se crea una sola vez con `fly volumes create lean_os_data`.
[[mounts]]
  source = "lean_os_data"
  destination = "/data"
  initial_size = "1gb"
  scheduled_snapshots = true
  snapshot_retention = 60 # días; el máximo que permite Fly

# Con un solo volumen no puede haber dos máquinas a la vez: se reemplaza la máquina en el lugar.
[deploy]
  strategy = "rolling"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
